<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вина TerraVino</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
    }
    header {
      background: url('https://images.unsplash.com/photo-1600077096000-3b642681bb91?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80') no-repeat center center/cover;
      color: white;
      padding: 3rem 1rem;
      text-align: center;
    }
    header h1 {
      font-size: 2.5rem;
      margin: 0;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
    }
    nav button {
      background: #8B0000;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
    }
    section {
      padding: 2rem 1rem;
      max-width: 900px;
      margin: auto;
    }
    section h2 {
      color: #8B0000;
    }
    .cta {
      background-color: #f4f4f4;
      padding: 2rem;
      text-align: center;
    }
    .cta button {
      background: #8B0000;
      color: white;
      font-size: 1.2rem;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 1rem;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 1.8rem;
      }
      nav {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Вина TerraVino</h1>
    <nav>
      <button onclick="alert('Перехід до колекції')">Колекція</button>
      <button onclick="alert('Перехід до про нас')">Про нас</button>
      <button onclick="alert('Перехід до контактів')">Контакти</button>
    </nav>
  </header>

  <section>
    <h2>Наша філософія</h2>
    <p>Ми створюємо вино з душею, використовуючи найкращі сорти винограду, вирощеного в українських виноградниках.</p>
  </section>

  <section class="cta">
    <h2>Спробуйте наші вина вже сьогодні</h2>
    <button onclick="alert('Зробити замовлення')">Замовити</button>
  </section>

  <footer>
    &copy; 2025 TerraVino. Всі права захищено.
  </footer>
</body>
</html>
